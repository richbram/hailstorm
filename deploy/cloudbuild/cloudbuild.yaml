# =============================================================================
# Hailstorm — Google Cloud Build Pipeline
#
# Triggered automatically when commits are pushed to the connected repository
# (mirrored from GitHub via Cloud Source Repositories).
#
# Trigger configuration (set in Cloud Build console or via gcloud):
#   - Branch filter: ^develop$   → deploys to the 'dev' Cloud Run service
#   - Branch filter: ^main$      → deploys to the 'prod' Cloud Run service
#
# Required substitution variables (set in Cloud Build trigger):
#   _REGION          GCP region, e.g. us-central1
#   _SERVICE_NAME    Cloud Run service name, e.g. hailstorm-dev
#   _IMAGE_NAME      Artifact Registry image path
#
# Required IAM roles on the Cloud Build service account:
#   - roles/run.admin
#   - roles/artifactregistry.writer
#   - roles/iam.serviceAccountUser
# =============================================================================

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: hailstorm-dev
  _IMAGE_NAME: us-central1-docker.pkg.dev/${PROJECT_ID}/hailstorm/snowstorm

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ---------------------------------------------------------------------------
  # Step 1 — Build the Docker image
  # ---------------------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --tag
      - ${_IMAGE_NAME}:${SHORT_SHA}
      - --tag
      - ${_IMAGE_NAME}:latest
      - --cache-from
      - ${_IMAGE_NAME}:latest
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - .
    env:
      - DOCKER_BUILDKIT=1

  # ---------------------------------------------------------------------------
  # Step 2 — Push image to Artifact Registry
  # ---------------------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_IMAGE_NAME}
    waitFor:
      - build

  # ---------------------------------------------------------------------------
  # Step 3 — Deploy to Cloud Run
  # ---------------------------------------------------------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_IMAGE_NAME}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --memory=8Gi
      - --cpu=4
      - --min-instances=0
      - --max-instances=3
      - --concurrency=80
      - --timeout=3600
      - --port=8080
      - --set-env-vars=SNOWSTORM_READONLY=false
      - --service-account=hailstorm-sa@${PROJECT_ID}.iam.gserviceaccount.com
    waitFor:
      - push

images:
  - ${_IMAGE_NAME}:${SHORT_SHA}
  - ${_IMAGE_NAME}:latest

timeout: 3600s
