# =============================================================================
# Hailstorm — Snowstorm Application Configuration
#
# This file provides base Spring Boot / Snowstorm configuration.
# Environment-specific overrides should be injected via Cloud Run environment
# variables (prefix: SPRING_*) or Secret Manager mounted volumes.
#
# Reference: https://github.com/IHTSDO/snowstorm/blob/master/docs/configuration-guide.md
# =============================================================================

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
# Port is set by the entrypoint script via --server.port=${PORT}
# server.port=8080

# ---------------------------------------------------------------------------
# Elasticsearch
# ---------------------------------------------------------------------------
# URL is set by the entrypoint script via --elasticsearch.urls=...
# elasticsearch.urls=http://127.0.0.1:9200

# Index prefix — useful when sharing an ES cluster across environments
elasticsearch.index.prefix=hailstorm.

# Number of shards per index (increase for multi-node ES clusters)
elasticsearch.index.shards=1

# Number of replicas (set to 1+ for fault tolerance in multi-node clusters)
elasticsearch.index.replicas=0

# ---------------------------------------------------------------------------
# Snowstorm API
# ---------------------------------------------------------------------------
# Read-only mode — set to true after initial data load in production
# snowstorm.rest-api.readonly=false

# Allow cross-origin requests (useful for browser-based FHIR clients)
snowstorm.rest-api.allowedOrigins=*

# ---------------------------------------------------------------------------
# FHIR
# ---------------------------------------------------------------------------
# Base URL for FHIR capability statement — set to your Cloud Run service URL
# hapi.fhir.server_address=https://hailstorm-<hash>-uc.a.run.app/fhir

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.root=WARN
logging.level.org.snomed.snowstorm=INFO
logging.level.org.elasticsearch=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# ---------------------------------------------------------------------------
# Management / Health endpoints (used by Cloud Run health checks)
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.elasticsearch.enabled=true
